const STORAGE_KEYS = {
  workoutLog: 'marathon-workout-log-v5',
  customPlan: 'marathon-custom-plan-v5'
};

function parseExcelToWorkoutPlan(workbook) {
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet);
  const workoutPlan = {};
  
  rows.forEach(row => {
    let dateStr;
    const dateVal = row.Date || row.date;
    
    if (typeof dateVal === 'number') {
      const date = XLSX.SSF.parse_date_code(dateVal);
      dateStr = `${date.y}-${String(date.m).padStart(2, '0')}-${String(date.d).padStart(2, '0')}`;
    } else if (dateVal instanceof Date) {
      dateStr = dateVal.toISOString().split('T')[0];
    } else if (typeof dateVal === 'string') {
      const parsed = new Date(dateVal);
      dateStr = !isNaN(parsed) ? parsed.toISOString().split('T')[0] : dateVal;
    }
    
    if (!dateStr) return;
    
    const week = row.Week || row.week || 1;
    const day = row.Day || row.day || '';
    const timeOfDay = (row.Time_of_Day || row.TimeOfDay || 'AM').toUpperCase();
    const session = row.Session || row.session || '';
    const sessionType = row.Session_Type || row.SessionType || '';
    const exercise = row.Exercise || row.exercise || '';
    const sets = row.Sets || row.sets || '';
    const reps = row.Reps_or_Duration || row.Reps || row.reps || '';
    const notes = row.Notes || row.notes || '';
    
    if (!workoutPlan[dateStr]) {
      workoutPlan[dateStr] = { date: dateStr, week: week, day: day, am: null, pm: null };
    }
    
    const slot = timeOfDay === 'AM' ? 'am' : 'pm';
    const isExerciseBased = ['strength', 'mobility', 'core', 'recovery'].some(t => sessionType.toLowerCase().includes(t));
    
    if (isExerciseBased && exercise) {
      if (!workoutPlan[dateStr][slot]) {
        workoutPlan[dateStr][slot] = { session: session, type: 'Strength', exercises: [] };
      }
      workoutPlan[dateStr][slot].exercises.push({ name: exercise, sets: String(sets), reps: String(reps), notes: notes });
    } else if (!isExerciseBased) {
      workoutPlan[dateStr][slot] = { session: session, type: 'Run/Cardio', notes: notes || `${exercise} ${reps}`.trim() };
    }
  });
  
  return workoutPlan;
}
