const STORAGE_KEYS = {
  workoutLog: 'strength-cardio-workout-log-v1',
  customPlan: 'strength-cardio-custom-plan-v1'
};

function parseExcelToWorkoutPlan(workbook) {
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet);
  const workoutPlan = {};
  
  rows.forEach(row => {
    let dateStr;
    const dateVal = row.Date || row.date;
    
    if (typeof dateVal === 'number') {
      const date = XLSX.SSF.parse_date_code(dateVal);
      dateStr = `${date.y}-${String(date.m).padStart(2, '0')}-${String(date.d).padStart(2, '0')}`;
    } else if (dateVal instanceof Date) {
      dateStr = dateVal.toISOString().split('T')[0];
    } else if (typeof dateVal === 'string') {
      const parsed = new Date(dateVal);
      dateStr = !isNaN(parsed) ? parsed.toISOString().split('T')[0] : dateVal;
    }
    
    if (!dateStr) return;
    
    const week = row.Week || row.week || 1;
    const day = row.Day || row.day || '';
    const timeOfDay = (row.Time_of_Day || row.TimeOfDay || 'AM').toUpperCase();
    const session = row.Session || row.session || '';
    const sessionType = row.Session_Type || row.SessionType || '';
    const exercise = row.Exercise || row.exercise || '';
    const sets = row.Sets || row.sets || '';
    const reps = row.Reps_or_Duration || row.Reps || row.reps || '';
    const notes = row.Notes || row.notes || '';
    
    if (!workoutPlan[dateStr]) {
      workoutPlan[dateStr] = { date: dateStr, week: week, day: day, am: null, pm: null };
    }
    
    const slot = timeOfDay === 'AM' ? 'am' : 'pm';
    const isExerciseBased = ['strength', 'mobility', 'core', 'recovery'].some(t => sessionType.toLowerCase().includes(t));
    
    if (isExerciseBased && exercise) {
      if (!workoutPlan[dateStr][slot]) {
        workoutPlan[dateStr][slot] = { session: session, type: 'Strength', exercises: [] };
      }
      workoutPlan[dateStr][slot].exercises.push({ name: exercise, sets: String(sets), reps: String(reps), notes: notes });
    } else if (!isExerciseBased) {
      workoutPlan[dateStr][slot] = { session: session, type: 'Run/Cardio', notes: notes || `${exercise} ${reps}`.trim() };
    }
  });
  
  return workoutPlan;
}

function WorkoutTracker() {
  const [selectedDate, setSelectedDate] = React.useState(new Date().toISOString().split('T')[0]);
  const [workoutPlan, setWorkoutPlan] = React.useState(DEFAULT_WORKOUT_DATA);
  const [workoutLog, setWorkoutLog] = React.useState({});
  const [activeTab, setActiveTab] = React.useState('am');
  const [viewMode, setViewMode] = React.useState('day');
  const [isLoading, setIsLoading] = React.useState(true);
  const [showLogModal, setShowLogModal] = React.useState(false);
  const [showUploadModal, setShowUploadModal] = React.useState(false);
  const [currentExercise, setCurrentExercise] = React.useState(null);
  const [logEntry, setLogEntry] = React.useState({ setLogs: [], notes: '', completed: false });
  const [cardioLog, setCardioLog] = React.useState({ duration: '', distance: '', avgPace: '', heartRate: '', notes: '', completed: false });
  const [notification, setNotification] = React.useState(null);
  const [uploadStatus, setUploadStatus] = React.useState(null);
  const fileInputRef = React.useRef(null);

  const parseSetCount = (sets) => {
    const n = parseInt(sets, 10);
    return (!isNaN(n) && n > 0 && n < 50) ? n : 1;
  };

  const migrateLegacyLog = (log) => {
    if (!log) return log;
    Object.keys(log).forEach(date => {
      Object.keys(log[date] || {}).forEach(session => {
        Object.keys(log[date][session] || {}).forEach(ex => {
          const e = log[date][session][ex];
          const isCardio = e && (e.duration !== undefined || e.distance !== undefined || e.avgPace !== undefined || e.heartRate !== undefined);
          if (e && !e.setLogs && !isCardio && (e.sets !== undefined || e.weight !== undefined || e.reps !== undefined)) {
            const count = parseSetCount(e.sets);
            log[date][session][ex] = {
              setLogs: Array.from({ length: count }, () => ({ weight: e.weight || '', reps: e.reps || '', notes: '' })),
              notes: e.notes || '',
              completed: !!e.completed
            };
          }
        });
      });
    });
    return log;
  };

  React.useEffect(() => {
    try {
